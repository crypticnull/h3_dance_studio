[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dancekit"
version = "0.1.0"
description = "Beat-locked pose control for AI video generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
# Only needed for `dancekit extract` / harvesting from video.
extract = ["rtmlib>=0.0.13", "onnxruntime"]
# Only needed for `dancekit prep` from a URL.
prep = ["yt-dlp"]
test = ["pytest>=7.0"]

[project.scripts]
dancekit = "dancekit.cli:main"

[tool.setuptools.packages.find]
include = ["dancekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # librosa/numba emit deprecation chatter on import that we don't control.
    "ignore::DeprecationWarning",
]
